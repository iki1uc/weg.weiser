:root{
  --bg:#05080c; --pcb:#081410; --pcb2:#0b1a14; --pcb3:#0e2019;
  --gold:#f0d080; --green:#39ff88; --red:#ff6a5a; --cyan:#4ad0ff; --violet:#b388ff;
  --fg:#d8dde0; --muted:#6a7a72; --border:#1a3a2a; --border-hot:#2a5a3a;
}
*{box-sizing:border-box;font-family:ui-monospace,Menlo,Consolas,monospace}
html,body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;font-size:13px;overflow-x:hidden}
.app{display:flex;flex-direction:column;min-height:100vh;padding-top:var(--safe-area-inset-top,0);background:var(--bg);color:var(--fg)}
header{padding:10px 16px;background:rgba(5,8,12,.96);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:var(--safe-area-inset-top,0);z-index:40;backdrop-filter:blur(10px)}
header h1{margin:0;font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:700;line-height:1.2}
header .sub{font-size:8px;opacity:.55;letter-spacing:.14em;margin-top:2px;line-height:1.3}
.badge{font-size:8.5px;padding:2px 7px;border:1px solid var(--border);border-radius:99px;color:var(--muted);letter-spacing:.08em;white-space:nowrap;line-height:1.2}
.badge.on{color:var(--green);border-color:var(--green);background:rgba(57,255,136,.06)}
.badge.gold{color:var(--gold);border-color:rgba(240,208,128,.4)}
.badge.cyan{color:var(--cyan);border-color:rgba(74,208,255,.35)}
.badge.violet{color:var(--violet);border-color:rgba(179,136,255,.35)}
.badge.red{color:var(--red);border-color:rgba(255,106,90,.35)}
.status{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted);letter-spacing:.06em;flex-wrap:wrap}
.status b{color:var(--gold);font-weight:700;font-size:11px}
.btn{font:inherit;font-size:9px;padding:3px 9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;border-radius:3px;letter-spacing:.08em}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0;position:relative}
@media(max-width:980px){main{grid-template-columns:1fr}}
.board-wrap{position:relative;background:var(--pcb);overflow:hidden;min-height:740px;background-image:radial-gradient(circle at 20% 20%, rgba(57,255,136,.04), transparent 60%),radial-gradient(circle at 80% 80%, rgba(240,208,128,.03), transparent 60%),repeating-linear-gradient(90deg, transparent 0 39px, rgba(57,255,136,.025) 39px 40px),repeating-linear-gradient(0deg, transparent 0 39px, rgba(57,255,136,.025) 39px 40px)}
.board-wrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.board{position:relative;z-index:2;padding:22px 18px;display:grid;grid-template-areas:". cpu cpu ." "ram center center pcie" "ram djin gpu pcie" "bios djin gpu clock";grid-template-columns:150px 1fr 1fr 170px;grid-template-rows:auto auto auto auto;gap:12px;min-height:620px}
@media(max-width:1100px){.board{grid-template-columns:1fr 1fr;grid-template-areas:"cpu cpu" "ram pcie" "center center" "djin gpu" "bios clock";padding:14px;gap:10px}}
.slot{position:relative;border:1px solid var(--border);background:linear-gradient(180deg,var(--pcb2),var(--pcb));border-radius:5px;padding:8px 9px;cursor:pointer;transition:.18s;user-select:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 1px 0 rgba(0,0,0,.4)}
.slot:hover{border-color:var(--border-hot);background:linear-gradient(180deg,var(--pcb3),var(--pcb2))}
.slot.active{border-color:var(--green);background:rgba(57,255,136,.06);box-shadow:0 0 18px rgba(57,255,136,.3),inset 0 0 0 1px rgba(57,255,136,.2)}
.slot .lbl{font-size:7px;letter-spacing:.18em;color:var(--muted);margin-bottom:3px;font-weight:600}
.slot .name{font-size:10.5px;font-weight:700;color:var(--fg);letter-spacing:.05em}
.slot .tag{font-size:7.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.slot .led{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:#2a2a2a;transition:.15s;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.slot.active .led{background:var(--green);box-shadow:0 0 8px var(--green),0 0 0 1px rgba(0,0,0,.5)}
.cpu{grid-area:cpu;display:flex;flex-direction:column;align-items:center;padding:12px 10px;border-width:2px;border-color:var(--gold);background:linear-gradient(180deg,#0d1a14,#081410)}
.cpu .ring{width:74px;height:74px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;position:relative;margin:6px 0;background:radial-gradient(circle,rgba(240,208,128,.1),transparent 70%)}
.cpu .ring::before{content:'';position:absolute;inset:-12px;border:1px dashed rgba(240,208,128,.3);border-radius:50%;animation:spin 20s linear infinite}
.cpu .ring::after{content:'';position:absolute;inset:-20px;border:1px dotted rgba(240,208,128,.15);border-radius:50%;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.cpu .ring span{font-size:28px;color:var(--gold);text-shadow:0 0 18px var(--gold)}
.cpu .name{color:var(--gold);font-size:11px;letter-spacing:.22em;font-weight:700}
.cpu .clock{margin-top:4px;font-size:9.5px;color:var(--green);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.cpu .formula{font-size:8px;opacity:.5;margin-top:1px}
.ram{grid-area:ram;border-color:var(--cyan)}.ram .lbl{color:var(--cyan)}
.pcie{grid-area:pcie;border-color:var(--violet)}.pcie .lbl{color:var(--violet)}
.djin{grid-area:djin;border-width:2px;border-color:var(--gold);background:linear-gradient(180deg,#1a1410,#0d0e08)}.djin .name{color:var(--gold)}
.gpu{grid-area:gpu;border-color:var(--violet);background:linear-gradient(180deg,#140e1a,#08080a)}.gpu .name{color:var(--violet)}
.bios{grid-area:bios;border-color:var(--red)}.bios .name{color:var(--red)}
.clock-slot{grid-area:clock;border-color:var(--green)}.clock-slot .name{color:var(--green)}
.center{grid-area:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:10px;border:1px dashed var(--border);border-radius:5px;background:rgba(57,255,136,.02)}
.center .l{font-size:7px;color:var(--muted);letter-spacing:.18em;text-align:center}
.center .arrow{font-size:14px;color:var(--green);margin:1px 0}
.center .math{font-size:9px;color:var(--gold);letter-spacing:.12em;margin-top:2px;font-weight:700}
.slot-stack{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.mini{display:flex;align-items:center;gap:5px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;background:#0a1611;cursor:pointer;transition:.14s;font-size:9.5px;position:relative}
.mini:hover{border-color:var(--border-hot);background:#0d1e18}
.mini.on{border-color:var(--green);background:rgba(57,255,136,.1);box-shadow:0 0 10px rgba(57,255,136,.2)}
.mini .id{font-weight:700;color:var(--gold);font-size:9.5px;min-width:28px;font-variant-numeric:tabular-nums}
.mini .nm{flex:1;color:var(--fg);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .frm{font-size:7px;color:var(--muted);letter-spacing:.05em}
.mini .led{width:4px;height:4px;border-radius:50%;background:#2a2a2a;flex-shrink:0}
.mini.on .led,.mini.pulse .led{background:var(--green);box-shadow:0 0 6px var(--green)}
aside{background:#060a08;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
@media(max-width:980px){aside{border-left:0;border-top:1px solid var(--border)}}
.panel{border-bottom:1px solid var(--border);padding:9px 11px;flex-shrink:0}
.panel h3{margin:0 0 6px;font-size:8.5px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.panel .kv{display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
.panel .kv:last-child{border:0}
.panel .kv span:first-child{color:var(--muted)}
.panel .kv span:last-child{color:var(--fg)}
.panel .big{font-size:20px;color:var(--green);font-weight:700;letter-spacing:.08em;margin-top:5px;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(57,255,136,.4)}
.inspector{padding:9px 11px;background:#0a1410;border-bottom:1px solid var(--border);min-height:100px;font-size:10px}
.inspector h4{margin:0 0 5px;font-size:9.5px;color:var(--gold);letter-spacing:.14em;font-weight:700}
.inspector .row{display:flex;justify-content:space-between;padding:1px 0;font-variant-numeric:tabular-nums}
.inspector .row span:first-child{color:var(--muted)}
.inspector .row span:last-child{color:var(--fg)}
.inspector .empty{color:var(--muted);font-size:9.5px;line-height:1.5}
.log{flex:1;overflow:auto;padding:5px 11px;font-size:8.5px;line-height:1.5;min-height:0}
.log .line{padding:1px 0;border-bottom:1px dashed rgba(255,255,255,.04);font-variant-numeric:tabular-nums}
.log .t{color:var(--muted);margin-right:5px;font-size:8px}
.log .line.rein{color:var(--green)}
.log .line.raus{color:var(--red)}
.log .line.boot{color:var(--gold)}
.log .line.fetch{color:var(--cyan)}
/* OS Windows */
.os-layer{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:visible}
.os-win{position:absolute;pointer-events:auto;border:1px solid var(--border);background:linear-gradient(180deg,rgba(11,26,20,.96),rgba(8,20,16,.98));border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.03);display:flex;flex-direction:column;overflow:hidden;min-height:44px;backdrop-filter:blur(8px)}
.os-win .win-head{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--border);cursor:grab;user-select:none;background:rgba(0,0,0,.2)}
.os-win .win-head:active{cursor:grabbing}
.os-win .win-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.os-win .win-title{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--fg);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os-win .win-sub{font-size:7px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.os-win .win-ctrls{display:flex;gap:4px}
.os-win .win-btn{width:18px;height:18px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;display:grid;place-items:center;cursor:pointer;border-radius:3px;line-height:1}
.os-win .win-btn:hover{border-color:var(--gold);color:var(--gold)}
.os-win .win-body{padding:9px 10px;font-size:9.5px;line-height:1.55;color:var(--fg);overflow:auto;max-height:280px}
.os-win.min .win-body{display:none}
.os-win .kv{display:flex;justify-content:space-between;font-size:9px;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.os-win .tagline{font-size:8px;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
.os-win b{color:var(--gold);font-weight:700}
.os-win .hl{color:var(--green)}
.os-win .hl2{color:var(--cyan)}
.os-win .hlr{color:var(--red)}
/* Dock */
.dock{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;gap:5px;padding:6px 10px;background:rgba(5,8,12,.92);border-top:1px solid var(--border);backdrop-filter:blur(12px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:99px;background:rgba(10,22,17,.8);color:var(--muted);font-size:8.5px;letter-spacing:.08em;cursor:pointer;white-space:nowrap;transition:.15s}
.dock-btn:hover{border-color:var(--gold);color:var(--gold)}
.dock-btn.on{border-color:var(--green);color:var(--green);background:rgba(57,255,136,.08);box-shadow:0 0 10px rgba(57,255,136,.15)}
.dock-dot{width:6px;height:6px;border-radius:50%}
footer{border-top:1px solid var(--border);padding:8px 16px 68px 16px;font-size:8.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;letter-spacing:.06em;background:rgba(5,8,12,.96)}
footer b{color:var(--gold);font-weight:700}
