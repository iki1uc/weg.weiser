        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
        :root{
          --bg:#05060c;
          --panel:#111422;
          --panel-2:#0d1020;
          --edge:#2f375f;
          --edge-2:#1e274a;
          --gold:#ffd700;
          --cyan:#00ccff;
          --green:#42f5a7;
          --text:#e8ebf5;
          --muted:#8a90a8;
          --red:#ff3b6b;
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;}
        body{overflow-x-clip}
        .app-shell{
          min-height:100vh;
          background:

            radial-gradient(900px 500px at 10% 10%, #1a1540 0%, transparent 55%),

          box-sizing:border-box;
        }
        header{
          padding:28px max(18px,calc((100vw - 1100px)/2)) 18px;

          backdrop-filter: blur(14px);
          z-index:10;
        }
        .h1{
          margin:0;
          color:var(--gold);
          font-size:clamp(20px,3.6vw,34px);
          letter-spacing:.08em;

          text-shadow:0 0 18px #ffd70066;

          font-weight:700;
        }

          text-transform:uppercase;
        }
        main{max-width:1100px;margin:0 auto;padding:26px 18px 56px}
        .status{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}

        }
        .pill b{color:var(--green)}
        .pill.gold{color:var(--gold);border-color:#ffd70055}
        .pill.cyan{color:var(--cyan);border-color:#00ccff55}
        .intro{

          background:linear-gradient(145deg,#151a2a 0%,#0b0d16 100%);

          font-size:13px;
          line-height:1.6;

          position:relative;
          overflow:hidden;
        }
        .card::before{
          content:'';
          position:absolute;

        .actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
        .btn{
          display:inline-flex;
          align-items:center;
          gap:6px;
          border:1px solid var(--cyan);
          border-radius:7px;
          padding:8px 10px;
          color:var(--cyan);
          text-decoration:none;
          font-weight:700;
          font-size:12px;
          letter-spacing:.02em;
          transition:.18s;
        }

        .section-title{
          margin:36px 0 14px;
          color:var(--gold);
          font-size:12px;
          letter-spacing:.18em;
          text-transform:uppercase;
          display:flex;
          align-items:center;
          gap:10px;
        }
        .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}

        .raute-wrap{

          background:linear-gradient(180deg,#101423,#080a13);
          padding:18px;
          position:relative;
          overflow:hidden;
        }
        .raute-grid{
          display:grid;
          grid-template-columns:1fr 1.6fr 1fr;
          gap:12px;
          align-items:center;
          max-width:900px;
          margin:0 auto;
        }

          aspect-ratio:1;

            linear-gradient(180deg,#151a2a,#0b0d16);
          border-radius:18px;
          display:grid;
          place-items:center;
          overflow:visible;
          min-height:300px;
        }
        .raute-center-inner{
          transform:rotate(-45deg);
          width:82%;
          height:82%;
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:space-between;
          padding:10px 0;
        }
        .node{
          display:flex;
          flex-direction:column;
          align-items:center;
          gap:2px;
          font-size:11px;
          color:var(--text);
          transition:.3s;
          text-align:center;
        }
        .node .sym{
          width:34px;height:34px;
          border-radius:50%;
          display:grid;
          place-items:center;
          border:1px solid var(--edge);
          background:#0e1224;
          font-weight:700;
          font-size:16px;
        }
        .node.active .sym{border-color:var(--cyan);box-shadow:0 0 18px #00ccff55;color:var(--cyan);transform:scale(1.08)}
        .node.gold .sym{border-color:#ffd70066;color:var(--gold)}
        .node.green .sym{border-color:#42f5a766;color:var(--green);background:#0a1a14}
        .side-col{display:flex;flex-direction:column;gap:18px}
        .side-item{
          border:1px solid var(--edge-2);
          background:linear-gradient(145deg,#141a2e,#0d1020);
          border-radius:12px;
          padding:12px 12px;
          font-size:11px;
          color:var(--muted);
          line-height:1.5;
        }
        .side-item b{color:var(--text);display:block;font-size:12px;margin-bottom:2px;letter-spacing:.06em}
        .side-item b.gold{color:var(--gold)} .side-item b.cyan{color:var(--cyan)}
        .flow-bar{
          margin-top:14px;
          display:flex;
          gap:6px;
          flex-wrap:wrap;
          align-items:center;
          font-size:11px;
          color:var(--muted);
          letter-spacing:.06em;
        }
        .flow-step{
          border:1px solid var(--edge-2);
          border-radius:999px;
          padding:4px 10px;
          background:#0e1224;
          transition:.3s;
        }
        .flow-step.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px #00ccff33}
        .flow-step.green.on{border-color:var(--green);color:var(--green)}
        /* pi section */
        .pi-wrap{
          display:grid;
          grid-template-columns:1.1fr 0.9fr;
          gap:14px;
        }
        @media (max-width:800px){
          .raute-grid{grid-template-columns:1fr; }
          .raute-center{order:-1;min-height:340px}
          .pi-wrap{grid-template-columns:1fr}
        }
        .canvas-card{
          border:1px solid var(--edge);
          border-radius:14px;
          background:linear-gradient(180deg,#101427,#080a13);
          overflow:hidden;
          position:relative;
          min-height:280px;
        }
        .canvas-card canvas{width:100%;height:100%;display:block;min-height:280px}
        .pi-legend{
          border:1px solid var(--edge);
          border-radius:14px;
          background:linear-gradient(145deg,#151a2a,#0b0d16);
          padding:16px;
          font-size:12.5px;
          line-height:1.6;
          color:var(--muted);
        }
        .pi-legend b{color:var(--text)}
        .pi-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
        .toggle{
          border:1px solid var(--edge);
          background:#0e1224;
          color:var(--text);
          border-radius:999px;
          padding:6px 12px;
          font-size:11px;
          cursor:pointer;
        }
        .toggle.active{border-color:var(--cyan);color:var(--cyan)}
        .note{
          border-left:3px solid var(--gold);
          background:#17130a;
          color:#e8dba5;
          padding:12px 14px;
          margin:24px 0;
          border-radius:0 8px 8px 0;
          font-size:12px;
          line-height:1.6;
        }
        footer{
          color:var(--muted);
          font-size:11px;
          margin-top:26px;
          display:flex;
          flex-wrap:wrap;
          gap:12px;
          justify-content:space-between;
          border-top:1px solid var(--edge-2);
          padding-top:14px;
        }
