        header h1 small{font-size:10px;color:#5a7a8a;-webkit-text-fill-color:#5a7a8a;letter-spacing:1px;margin-left:8px}
        header h1 .final{font-size:9px;letter-spacing:2px;color:var(--gold);-webkit-text-fill-color:var(--gold);border:1px solid rgba(240,208,128,0.35);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
        .noah-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1px;padding:3px 8px;border-radius:20px;border:1px solid rgba(240,208,128,0.45);background:linear-gradient(135deg,rgba(240,208,128,0.18),rgba(179,136,255,0.12));color:var(--gold);-webkit-text-fill-color:var(--gold);box-shadow:0 0 12px rgba(240,208,128,0.15)}
        .noah-badge em{font-style:normal;font-weight:700;color:#fff;-webkit-text-fill-color:#fff;background:rgba(240,208,128,0.2);padding:1px 6px;border-radius:10px;margin-left:2px}
        .noah-badge.run{border-color:var(--gold);box-shadow:0 0 16px rgba(240,208,128,0.35)}
        .noah-badge.judge{border-color:#6cf;color:#6cf}
        .noah-badge.protect{border-color:var(--green);color:var(--green)}
        .status-leds{display:flex;gap:14px;font-size:10px;color:#6a8a7a;align-items:center;flex-wrap:wrap}
        .led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3a3a3a;margin-right:5px;transition:0.3s}
        .led.on{background:#8cf0d0;box-shadow:0 0 6px #8cf0d0}
        .led.master{background:#b388ff;box-shadow:0 0 6px #b388ff}
        .led.warn{background:#f0d080;box-shadow:0 0 6px #f0d080}
        .led.pulse{animation:pulse 1.4s infinite}
        @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
        #main{flex:1;display:grid;grid-template-columns:240px 1fr 260px;overflow:hidden}
        .col{padding:12px;overflow-y:auto;background:var(--panel)}
        #left{border-right:1px solid var(--line)}
        #right{border-left:1px solid var(--line)}
        #mobTabs{display:none}
        @media (max-width:900px){
          #main{grid-template-columns:1fr}
          #main .col{display:none}
          #main[data-tab="left"] #left{display:block}
          #main[data-tab="right"] #right{display:block}
          #main[data-tab="orbit"] #center{display:flex}
          #left,#right{border:none}
          #mobTabs{display:flex;gap:4px;padding:6px 10px;background:rgba(6,8,16,0.85);border-bottom:1px solid var(--line)}
          #mobTabs button{flex:1;background:rgba(20,20,30,0.6);border:1px solid rgba(179,136,255,0.2);color:var(--purple);padding:6px 0;border-radius:6px;font-family:inherit;font-size:10px;cursor:pointer}
          #mobTabs button.active{background:rgba(179,136,255,0.2);color:#fff;border-color:var(--purple)}
        }
        .panel-title{font-size:10px;color:var(--gold);letter-spacing:1.5px;border-bottom:1px solid rgba(255,215,0,0.08);padding-bottom:5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
        .panel-title .badge{font-size:8px;color:#5a7a8a;font-weight:400}
        .module-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;font-size:10px;color:#8aa8a0;cursor:pointer;border-left:2px solid transparent;transition:0.15s;margin-bottom:2px}
        .module-item:hover{background:rgba(120,220,150,0.04);color:#d0e8e0;border-left-color:#7ee0a0}
        .module-item.active{background:rgba(120,220,150,0.06);border-left-color:var(--green);color:#d0e8e0}
        .module-item .dot{width:6px;height:6px;border-radius:50%;background:#3a3a3a;flex-shrink:0;transition:0.3s}
        .module-item.active .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
        .module-item .name{flex:1}
        .module-item .size{font-size:8px;color:#4a5a5a}
        #center{display:flex;flex-direction:column;padding:12px;position:relative;overflow:hidden}
        #orbitWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:200px}
        #orbitCanvas{background:transparent;display:block;width:100%;height:100%}
        #orbitOverlay{position:absolute;top:12px;left:12px;font-size:10px;color:#6a8a7a;line-height:1.6;pointer-events:none}

        #orbitOverlay .purple{color:var(--purple)}
        .arbeit-panel{background:rgba(0,0,0,0.25);border:1px solid rgba(120,220,150,0.04);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:10px}

        .me2-buttons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
        .me2-buttons button{flex:1;min-width:55px;background:rgba(20,20,30,0.6);border:1px solid rgba(179,136,255,0.2);color:var(--purple);padding:4px 0;border-radius:5px;font-family:inherit;font-size:9px;cursor:pointer;transition:0.2s}
        .me2-buttons button:hover{background:rgba(179,136,255,0.1)}
